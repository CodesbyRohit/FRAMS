# ANIMA local development stack.
#
#   npm run infra:up                      # data services only: postgres, neo4j, redis, qdrant
#   docker compose -f infra/docker-compose.yml --profile app up -d --build
#                                         # + trust, api, web containers
#
# Host ports are overridable so the stack can coexist with other local
# projects, e.g. ANIMA_POSTGRES_PORT=55432 ANIMA_REDIS_PORT=56379 npm run infra:up
#
# This file is for local development. Credentials below are development
# defaults, not secrets; never reuse them in a deployed environment.

name: anima

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anima
      POSTGRES_PASSWORD: anima
      POSTGRES_DB: anima
    ports: ["${ANIMA_POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anima"]
      interval: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/anima-neo4j
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["${ANIMA_NEO4J_HTTP_PORT:-7474}:7474", "${ANIMA_NEO4J_BOLT_PORT:-7687}:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 18

  redis:
    image: redis:7-alpine
    ports: ["${ANIMA_REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["${ANIMA_QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      # The qdrant image ships without curl/wget; probe the port with bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 12

  # ── Application containers (opt-in: --profile app) ───────────────────────
  trust:
    profiles: [app]
    build: { context: ../services/trust, dockerfile: Dockerfile }
    environment:
      TRUST_SERVICE_TOKEN: ${TRUST_SERVICE_TOKEN:-anima-trust-local}
      TRUST_DATA_DIR: /data
    ports: ["${ANIMA_TRUST_PORT:-8090}:8090"]
    volumes: [trust_data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      retries: 12

  api:
    profiles: [app]
    # Context is the repo root: the image needs the workspace manifests and
    # packages/shared, not just services/api.
    build: { context: .., dockerfile: services/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      trust: { condition: service_healthy }
    environment:
      ANIMA_API_PORT: 4000
      ANIMA_JWT_SECRET: ${ANIMA_JWT_SECRET:-dev-secret-change-me-please-32chars-min}
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: anima-neo4j
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      TRUST_SERVICE_URL: http://trust:8090
      TRUST_SERVICE_TOKEN: ${TRUST_SERVICE_TOKEN:-anima-trust-local}
      ANIMA_LLM_BASE_URL: ${ANIMA_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      ANIMA_LLM_API_KEY: ${ANIMA_LLM_API_KEY:-}
      ANIMA_LLM_MODEL: ${ANIMA_LLM_MODEL:-gpt-4o-mini}
      ANIMA_EMBEDDING_MODEL: ${ANIMA_EMBEDDING_MODEL:-text-embedding-3-small}
      ANIMA_WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      # No migrations exist yet; this local stack lets TypeORM create the
      # schema. A real deployment must not set this (see docs/ROADMAP.md).
      ANIMA_DB_SYNCHRONIZE: "true"
    ports: ["${ANIMA_API_PORT:-4000}:4000"]

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: services/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["${ANIMA_WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  qdrant_data:
  trust_data:
