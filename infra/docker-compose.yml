# ANIMA local development stack.
# Usage:  npm run infra:up   (docker compose -f infra/docker-compose.yml up -d)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anima
      POSTGRES_PASSWORD: anima
      POSTGRES_DB: anima
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anima"]
      interval: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/anima-neo4j
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      retries: 12

  trust:
    build: { context: ../services/trust, dockerfile: Dockerfile }
    environment:
      TRUST_SERVICE_TOKEN: anima-trust-local
      TRUST_DATA_DIR: /data
    ports: ["8090:8090"]
    volumes: [trust_data:/data]

  api:
    build: { context: ../services/api, dockerfile: Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_started }
      trust: { condition: service_started }
    environment:
      ANIMA_API_PORT: 4000
      ANIMA_JWT_SECRET: ${ANIMA_JWT_SECRET:-dev-secret-change-me-please-32chars-min}
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: anima-neo4j
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      TRUST_SERVICE_URL: http://trust:8090
      TRUST_SERVICE_TOKEN: anima-trust-local
      ANIMA_LLM_BASE_URL: ${ANIMA_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      ANIMA_LLM_API_KEY: ${ANIMA_LLM_API_KEY:-}
      ANIMA_LLM_MODEL: ${ANIMA_LLM_MODEL:-gpt-4o-mini}
      ANIMA_EMBEDDING_MODEL: ${ANIMA_EMBEDDING_MODEL:-text-embedding-3-small}
      ANIMA_WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports: ["4000:4000"]

  web:
    build: { context: ../services/web, dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  qdrant_data:
  trust_data:
