apiVersion: v1
kind: Service
metadata: { name: neo4j, namespace: anima }
spec:
  selector: { app: neo4j }
  ports:
    - { name: bolt, port: 7687, targetPort: 7687 }
    - { name: http, port: 7474, targetPort: 7474 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: neo4j, namespace: anima }
spec:
  serviceName: neo4j
  replicas: 1
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata: { labels: { app: neo4j } }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26
          ports: [{ containerPort: 7687 }, { containerPort: 7474 }]
          env:
            - { name: NEO4J_AUTH, value: "neo4j/change-me" }
            - { name: NEO4J_server_memory_heap_max__size, value: "512m" }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
