apiVersion: v1
kind: Service
metadata: { name: trust, namespace: anima }
spec:
  selector: { app: trust }
  ports: [{ port: 8090, targetPort: 8090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: trust, namespace: anima }
spec:
  replicas: 1
  selector: { matchLabels: { app: trust } }
  template:
    metadata: { labels: { app: trust } }
    spec:
      containers:
        - name: trust
          image: anima/trust:latest
          ports: [{ containerPort: 8090 }]
          env:
            - { name: TRUST_SERVICE_TOKEN, value: anima-trust-local }
            - { name: TRUST_DATA_DIR, value: /data }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: anima }
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: anima }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: anima/api:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: anima-config }
            - secretRef: { name: anima-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: anima }
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: anima }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: anima/web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_URL, value: https://api.anima.example }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
