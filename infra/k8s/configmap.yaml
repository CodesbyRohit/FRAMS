apiVersion: v1
kind: ConfigMap
metadata:
  name: anima-config
  namespace: anima
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: anima
  POSTGRES_DB: anima
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  REDIS_URL: redis://redis:6379
  QDRANT_URL: http://qdrant:6333
  TRUST_SERVICE_URL: http://trust:8090
  TRUST_SERVICE_TOKEN: anima-trust-local
  ANIMA_WEB_ORIGIN: https://app.anima.example
  ANIMA_API_PORT: "4000"
  ANIMA_SESSION_TTL_SECONDS: "28800"
---
apiVersion: v1
kind: Secret
metadata:
  name: anima-secrets
  namespace: anima
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  NEO4J_PASSWORD: "change-me"
  ANIMA_JWT_SECRET: "change-me-to-a-long-random-secret"
  ANIMA_LLM_API_KEY: ""
  QDRANT_API_KEY: ""
