apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anima
  namespace: anima
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.anima.example, api.anima.example]
      secretName: anima-tls
  rules:
    - host: app.anima.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 3000 } } }
    - host: api.anima.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
